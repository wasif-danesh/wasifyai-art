# Engine-neutral Compose spec (Podman by default). Ports differ from wasifyai's so both stacks can run together.
name: wasifyai-art

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: wsh, POSTGRES_PASSWORD: wsh, POSTGRES_DB: wsh }
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsh -d wsh"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["6380:6379"]
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"wsh","credentials":[{"accessKey":"$$STORAGE_ACCESS_KEY","secretKey":"$$STORAGE_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=20 -master.volumeSizeLimitMB=256 -ip.bind=0.0.0.0
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-wsh-dev}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-wsh-dev-secret}
    ports: ["8334:8333"]
    volumes: ["seaweeddata:/data"]
  api:
    build: { context: ., dockerfile: services/api/Containerfile }
    environment:
      DATABASE_URL: postgresql+asyncpg://wsh:wsh@postgres:5432/wsh
      REDIS_URL: redis://redis:6379/0
      COMFYUI_MODE: ${COMFYUI_MODE:-stub}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      DATA_DIR: /data
    volumes: ["creations:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8010:8000"]
  worker:
    build: { context: ., dockerfile: services/api/Containerfile }
    command: ["python", "-m", "wasifyai_art_api.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://wsh:wsh@postgres:5432/wsh
      REDIS_URL: redis://redis:6379/0
      COMFYUI_MODE: ${COMFYUI_MODE:-stub}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      DATA_DIR: /data
    volumes: ["creations:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: { context: ., dockerfile: apps/web/Containerfile }
    environment:
      API_BASE_URL: http://api:8000
    depends_on: [api]
    ports: ["3010:3010"]

volumes: { pgdata: {}, seaweeddata: {}, creations: {} }

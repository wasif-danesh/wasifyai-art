[project]
name = "wasifyai-art"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.380", "httpx>=0.27"]

[tool.uv.workspace]
members = ["services/api", "packages/contracts"]

[tool.uv.sources]
wasifyai-art-api = { workspace = true }
wasifyai-art-contracts = { workspace = true }

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyright]
include = ["services", "packages"]
exclude = ["**/node_modules", "**/.venv"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "packages"]

[project]
name = "wasifyai-art-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyyaml>=6",
  "redis>=5",
  "httpx>=0.27",
  "websockets>=13",
  "pillow>=10",
  "obstore>=0.8",
  "wasifyai-art-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasifyai_art_api"]
